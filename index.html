<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>최미라의 포트폴리오</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <!-- 디자인 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page-background" aria-hidden="true">
    <video class="page-background-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
      <source src="images/hero-background.mp4" type="video/mp4">
    </video>
  </div>

  <!-- ============================================
       ① 상단 메뉴 (스크롤해도 위에 붙어 있어요)
       ============================================ -->
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="#top">
        <span id="logo-name">이름</span>
        <span class="logo-sub">Portfolio</span>
      </a>
      <nav class="menu">
        <a href="#works">작품</a>
        <a href="#about">소개</a>
        <a href="#contact">연락처</a>
      </nav>
    </div>
  </header>


  <main class="container" id="top">
    <section class="intro" aria-labelledby="headline">
      <div class="intro-copy">
        <div class="intro-identity"><div class="avatar" id="avatar"></div><span id="bio"></span></div>
        <h1 id="headline">출판 편집에서<br>데이터 저널리즘까지</h1>
        <p>AI 영상, 데이터 보도, 웹앱으로 작업의 범위를 넓히고 있어요.</p>
        <a class="hero-link" href="#works">분야별 작품 보기 ↓</a>
      </div>
      <a class="hero-media" id="hero-feature" href="#apps" hidden>
        <img id="hero-image" alt="">
        <span id="hero-caption"></span>
      </a>
      <div class="reporter-controls">
        <button id="reporter-toggle" class="filter-button" type="button" aria-pressed="false">
          <img src="images/dangchoe-avatar.png" alt="" width="24" height="24">
          <span>당최 아바타 켜기</span>
        </button>
        <p id="reporter-status" role="status" hidden></p>
      </div>
    </section>

    <section id="works" aria-labelledby="works-title">
      <h2 id="works-title">작품</h2>
      <nav class="work-nav" id="work-nav" aria-label="작품 분야"></nav>
      <div id="card-grid"><p role="status">작품을 불러오는 중이에요.</p></div>
    </section>

    <section class="about" id="about">
      <h2>소개</h2>
      <div class="about-grid" id="about-grid"></div>
    </section>
  </main>

  <footer class="footer" id="contact">
    <div class="container footer-inner">
      <div class="contact-list" id="contact-list"></div>
      <span>© 2026 <span id="footer-name"></span></span>
    </div>
  </footer>

<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
</script>
<script src="script.js"></script>
</body>

</html>
